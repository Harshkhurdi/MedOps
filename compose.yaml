services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: medops
      POSTGRES_USER: medops
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medops_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medops -d medops"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://medops:${LOCAL_DB_PASSWORD}@db:5432/medops
      DIRECT_URL: postgresql://medops:${LOCAL_DB_PASSWORD}@db:5432/medops
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /private-files
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - medops_files:/private-files
volumes:
  medops_db:
  medops_files:
